name: Render Rudi full video

on:
  workflow_dispatch:

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0, end: 330 }
          - { start: 331, end: 661 }
          - { start: 662, end: 992 }
          - { start: 993, end: 1323 }
          - { start: 1324, end: 1654 }
          - { start: 1655, end: 1985 }
          - { start: 1986, end: 2316 }
          - { start: 2317, end: 2642 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Google Chrome and ffmpeg
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb ffmpeg
          google-chrome --version
      - name: Install dependencies
        run: npm install
      - name: Reassemble audio
        run: |
          mkdir -p public/rudi
          cat audio-parts/voice.mp3.b64.part-00 | base64 -d > public/rudi/voice.mp3
          cat audio-parts/mix.wav.b64.part-0* | base64 -d > public/rudi/mix.wav
          ls -la public/rudi/
      - name: Render chunk ${{ matrix.start }}-${{ matrix.end }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-chunk.mjs ${{ matrix.start }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/rudi/chunks/chunk-${{ matrix.start }}-${{ matrix.end }}.mp4
          retention-days: 7

  concat:
    needs: render-chunk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk-*
          merge-multiple: true
      - name: Reassemble mix audio
        run: |
          mkdir -p public/rudi
          cat audio-parts/mix.wav.b64.part-0* | base64 -d > public/rudi/mix.wav
          ls -la public/rudi/mix.wav
      - name: Concat video + mix audio
        run: |
          ls -la chunks/
          for f in chunks/chunk-*.mp4; do echo "file '$f'" >> concat.txt; done
          sort -t- -k2 -n concat.txt -o concat.txt
          cat concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -i public/rudi/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest out/rudi/Rudi_Video_Final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/rudi/Rudi_Video_Final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Rudi_Final
          path: out/rudi/Rudi_Video_Final.mp4
          retention-days: 30
