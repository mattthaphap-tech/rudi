name: Render Rudi retry chunks

on:
  workflow_dispatch:

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 1324, end: 1654 }
          - { start: 1986, end: 2316 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Google Chrome and ffmpeg
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb ffmpeg
          google-chrome --version
      - name: Install dependencies
        run: npm install
      - name: Reassemble audio
        run: |
          mkdir -p public/rudi
          cat audio-parts/voice.mp3.b64.part-00 | base64 -d > public/rudi/voice.mp3
          cat audio-parts/mix.wav.b64.part-0* | base64 -d > public/rudi/mix.wav
          ls -la public/rudi/
      - name: Render chunk ${{ matrix.start }}-${{ matrix.end }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-chunk.mjs ${{ matrix.start }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/rudi/chunks/chunk-${{ matrix.start }}-${{ matrix.end }}.mp4
          retention-days: 7
